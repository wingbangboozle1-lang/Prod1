name: site-checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build site from data/
        run: python3 tools/build_site.py
      - name: Publishing gate (disclosure, sponsored links, tags, sources, links, sitemap)
        run: python3 tools/check_site.py
      - name: Fail if generated site is out of date
        run: git diff --exit-code -- docs/ || (echo "docs/ is stale: run python3 tools/build_site.py and commit" && exit 1)
